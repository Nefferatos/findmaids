name: Deploy to Cloudflare Workers

# OpenNext creates symlinks while bundling, which Windows blocks (EPERM), so the
# Worker is built and uploaded on a Linux runner.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Database (single .env equivalent; values live in repo secrets)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_SCHEMA: public
      # Auth / platform secrets
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      # Non-secret defaults (mirrored in wrangler.jsonc vars)
      APP_ENV: production
      NODE_ENV: production
      # Test/demo agencies and maids are never rendered by the deployed site
      # (see lib/sample-data.ts). Localhost keeps them.
      SHOW_SAMPLE_DATA: "false"
      AI_PROVIDER: mock
      AI_MODEL: mock
      PAYMENT_PROVIDER: mock
      EMAIL_DELIVERY_DISABLED: "true"
      LEAD_CAP_MODE: DELIVER_ALL
      BUSINESS_COUNTRY: SG
      MANUAL_BANK_TRANSFER_ENABLED: "false"
      LOG_LEVEL: info
      # The OpenNext bundle is large; give Node room so wrangler's bundling step
      # does not die with a JavaScript heap error.
      NODE_OPTIONS: "--max-old-space-size=8192"
      # `wrangler deploy` normally detects an OpenNext project and re-enters
      # `opennextjs-cloudflare deploy`, which spawns a second wrangler. There is
      # no incremental cache to populate here (`populate-cache` is a no-op), so
      # deploy the already-built Worker directly instead.
      OPEN_NEXT_DEPLOY: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        # `wrangler deploy` only discovers a missing Cloudflare token after the
        # whole build has run, and shipping code ahead of its database migration
        # breaks every Prisma query (logins included). Both are checked up front
        # so the failure is immediate and actionable.
        run: |
          missing=""
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -z "${DATABASE_URL:-}" ]; then missing="$missing DATABASE_URL"; fi
          if [ -n "$missing" ]; then
            echo "::error::Required deploy secrets are missing:$missing"
            echo "Add them under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # NODE_ENV=production is set for the build, but npm skips devDependencies
        # in that mode; typescript, prisma, vitest and @opennextjs/cloudflare are
        # all devDependencies, so ask for them explicitly.
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate Next.js types
        # next-env.d.ts references .next/types/*, which only exist after type
        # generation; without this, tsc fails in a clean checkout.
        run: npx next typegen

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Unit tests
        env:
          # Unit tests must never touch the deployed database (the job inherits
          # its URL for the migration step). With an empty URL `lib/prisma.ts`
          # falls back to the in-memory client, so the suite is hermetic and
          # behaves exactly like `npm test` on a developer machine.
          DATABASE_URL: ""
          DIRECT_URL: ""
        run: npx vitest run

      - name: Apply database migrations
        run: |
          set +e
          if [ -z "${DATABASE_URL:-}" ]; then
            # The Worker's Prisma client selects every column, including those a
            # pending migration adds, so code must never ship ahead of its schema.
            echo "::error::DATABASE_URL is not configured; refusing to deploy code that expects the current schema."
            exit 1
          fi
          # Supabase's pooled endpoint cannot run DDL. Migrations use the direct
          # connection, and fall back to DATABASE_URL when that secret is empty.
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::warning::DIRECT_URL is empty; migrations will use DATABASE_URL."
            export DIRECT_URL="$DATABASE_URL"
          fi
          npx prisma migrate deploy 2>&1 | tee migrate.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -40 migrate.log | sed 's/^/::error::migrate /'
          fi
          exit "$status"

      - name: Build and deploy Worker
        run: |
          set +e
          npm run deploy:cf 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Print the bundle sizes before the log tail: GitHub keeps only the
            # last few annotations, and a silent kill (OOM) leaves no error line.
            echo "::error::deploy step exited with status ${status}"
            du -sh .open-next .next/standalone 2>/dev/null | sed 's/^/::error::size /'
            du -sh .open-next/server-functions/default/node_modules 2>/dev/null | sed 's/^/::error::size /'
            ls -lh .open-next/worker.js .open-next/server-functions/default/handler.mjs 2>/dev/null | sed 's/^/::error::size /'
            # Wrangler writes the real failure reason to its own log file and only
            # prints the path to stdout, so surface the tail of that log too.
            wrangler_log=$(ls -t "$HOME/.config/.wrangler/logs/"wrangler-*.log 2>/dev/null | head -1)
            if [ -n "$wrangler_log" ]; then
              tail -15 "$wrangler_log" | sed 's/^/::error::wrangler /'
            fi
            tail -3 deploy.log | sed 's/^/::error::log /'
          fi
          exit "$status"
