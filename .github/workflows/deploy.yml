name: Deploy to Cloudflare Workers

# OpenNext creates symlinks while bundling, which Windows blocks (EPERM), so the
# Worker is built and uploaded on a Linux runner.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Database (single .env equivalent; values live in repo secrets)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      DATABASE_SCHEMA: public
      # Auth / platform secrets
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      # Non-secret defaults (mirrored in wrangler.jsonc vars)
      APP_ENV: production
      NODE_ENV: production
      AI_PROVIDER: mock
      AI_MODEL: mock
      PAYMENT_PROVIDER: mock
      EMAIL_DELIVERY_DISABLED: "true"
      LEAD_CAP_MODE: DELIVER_ALL
      BUSINESS_COUNTRY: SG
      MANUAL_BANK_TRANSFER_ENABLED: "false"
      LOG_LEVEL: info
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate Next.js types
        # next-env.d.ts references .next/types/*, which only exist after type
        # generation; without this, tsc fails in a clean checkout.
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build and deploy Worker
        run: npm run deploy:cf
